name: Feature request
description: Ask for a new check, field type or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Say what you want to change. Add an example ACF JSON file if you can.
